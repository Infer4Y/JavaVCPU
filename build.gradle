plugins {
    id 'java'
    id 'application'
}

group = 'xyz.ignite4inferneo'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
// These headless storage checks have no external test-library dependencies.
var regressionClasses = layout.buildDirectory.dir('classes/storageRegression')
tasks.register('compileStorageRegression', JavaCompile) {
    source = files(sourceSets.main.java, fileTree('src/test/java') { include '**/*Regression.java' })
    classpath = files()
    options.incremental = false
    destinationDirectory = regressionClasses
}
tasks.register('storageRegression', JavaExec) {
    dependsOn compileStorageRegression
    classpath = files(regressionClasses)
    mainClass = 'xyz.ignite4inferneo.DosStorageRegression'
    args layout.buildDirectory.file('storage-regression.img').get().asFile.absolutePath
}
check.dependsOn storageRegression

// Rebuild the guest desktop executable and the offline Workshop installation asset.
tasks.register('desktopImage', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'xyz.ignite4inferneo.jvdos.DesktopImage'
    args file('examples/dos/JCTRL.COM').absolutePath, file('tools/disk-workshop/desktop.js').absolutePath
}

application {
    mainClass = 'xyz.ignite4inferneo.Main'
}
