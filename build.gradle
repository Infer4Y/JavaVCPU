plugins {
    id 'java'
    id 'application'
}

group = 'xyz.ignite4inferneo'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
// These headless storage checks have no external test-library dependencies.
var regressionClasses = layout.buildDirectory.dir('classes/storageRegression')
tasks.register('compileStorageRegression', JavaCompile) {
    source = files(sourceSets.main.java, file('examples/jctrl/BrowserImage.java'), fileTree('src/test/java') { include '**/*Regression.java' })
    classpath = files()
    options.incremental = false
    destinationDirectory = regressionClasses
}
tasks.register('storageRegression', JavaExec) {
    dependsOn compileStorageRegression
    classpath = files(regressionClasses)
    mainClass = 'xyz.ignite4inferneo.JvFsRegression'
    args layout.buildDirectory.file('storage-regression.img').get().asFile.absolutePath
}
check.dependsOn storageRegression

// Rebuild the guest desktop executable and the offline Workshop installation asset.
tasks.register('desktopImage', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'xyz.ignite4inferneo.jvdos.DesktopImage'
    args file('examples/dos/JCTRL.COM').absolutePath, file('tools/disk-workshop/desktop.js').absolutePath
}

application {
    mainClass = 'xyz.ignite4inferneo.Main'
}

// Build JCTRL guest examples without adding their generators to the application jar.
tasks.register('compileJctrlExamples', JavaCompile) {
    source = files(sourceSets.main.java, fileTree('examples/jctrl') { include '*.java' })
    classpath = files()
    options.incremental = false
    destinationDirectory = layout.buildDirectory.dir('classes/jctrlExamples')
}
tasks.register('jctrlExamples', JavaExec) {
    dependsOn compileJctrlExamples
    classpath = files(layout.buildDirectory.dir('classes/jctrlExamples'))
    mainClass = 'xyz.ignite4inferneo.jvdos.PongImage'
    args file('examples/jctrl/PONG.COM').absolutePath
}

tasks.register('browserExample', JavaExec) {
    dependsOn compileJctrlExamples
    classpath = files(layout.buildDirectory.dir('classes/jctrlExamples'))
    mainClass = 'xyz.ignite4inferneo.jvdos.BrowserImage'
    args file('examples/jctrl/WEB.COM').absolutePath
}

// Run the windowed guest HTTP reader against a local test server.
tasks.register('browserRegression', JavaExec) {
    dependsOn compileStorageRegression, browserExample
    classpath = files(regressionClasses)
    mainClass = 'xyz.ignite4inferneo.BrowserRegression'
}
check.dependsOn browserRegression

// Independent COM clients exercise the shared desktop ABI and rendering cost.
tasks.register('desktopServicesRegression', JavaExec) {
    dependsOn compileStorageRegression
    classpath = files(regressionClasses)
    mainClass = 'xyz.ignite4inferneo.jvdos.DesktopServicesRegression'
}
check.dependsOn desktopServicesRegression

// Navigation/framing fixtures run separately from the larger filesystem browser scenario.
tasks.register('browserNavigationRegression', JavaExec) {
    dependsOn compileStorageRegression, browserExample
    classpath = files(regressionClasses)
    mainClass = 'xyz.ignite4inferneo.BrowserRegression'
    args 'navigation'
}
check.dependsOn browserNavigationRegression

tasks.register('browserFormsRegression', JavaExec) {
    dependsOn compileStorageRegression, browserExample
    classpath = files(regressionClasses)
    mainClass = 'xyz.ignite4inferneo.BrowserRegression'
    args 'forms'
}

// The headless driver shares the generator's compact state layout.
tasks.named('compileTestJava', JavaCompile) {
    source file('examples/jctrl/BrowserImage.java')
}
check.dependsOn browserFormsRegression
